services:

  # ==========================================
  # FastAPI Application
  # ==========================================

  api:
    build: .
    container_name: careerconnect_api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads

    networks:
      - careerconnect_net


# ==========================================
# Network
# ==========================================

networks:
  careerconnect_net:
    driver: bridge